<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<title>Treino ABCD-01 · Foco em Superiores</title>
<!-- PWA -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Focus">
<!-- iOS: instalar na tela de início -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Focus">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fontes carregadas sem bloquear a renderização: a página pinta na hora com a
     fonte do sistema e troca pra Oswald/Inter assim que elas chegarem. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"></noscript>
<style>
  :root{
    --bg:#0E1116; --surface:#161A22; --surface2:#1E232E; --line:#2A303C;
    --text:#EDEFF3; --muted:#98A0B2; --amber:#FFB020; --teal:#2FD3B8;
    --rose:#FF6B6B; --indigo:#8B95FF; --green:#4ADE80;
    --disp:'Oswald', system-ui, sans-serif;
    --body:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html{-webkit-text-size-adjust:100%}
  html,body{max-width:100%; overflow-x:hidden}
  body{background:var(--bg); color:var(--text); font-family:var(--body); line-height:1.5; padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .wrap{max-width:760px; margin:0 auto; padding:0 calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left))}
  header{position:sticky; top:0; z-index:20; background:rgba(14,17,22,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
  .head-inner{padding:calc(16px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left))}
  .kicker{font-family:var(--body); font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--amber); font-weight:600}
  h1{font-family:var(--disp); font-weight:700; font-size:26px; line-height:1.05; letter-spacing:.01em; margin-top:2px}
  h1 span{color:var(--muted); font-weight:500}
  .meta{font-size:12px; color:var(--muted); margin-top:4px}
  .meta b{color:var(--text); font-weight:600}
  .plan-switch{display:flex; gap:6px; margin-top:10px}
  .plan-btn{flex:1; font-family:var(--disp); font-weight:600; font-size:11px; letter-spacing:.05em; text-transform:uppercase; padding:8px 4px; border-radius:9px; border:1px solid var(--line); background:var(--surface2); color:var(--muted); cursor:pointer; transition:.15s}
  .plan-btn.on{background:var(--amber); border-color:var(--amber); color:var(--bg)}
  .plan-btn:active{transform:scale(.96)}
  nav{display:flex; gap:6px; overflow-x:auto; padding:10px calc(14px + env(safe-area-inset-right)) 12px calc(14px + env(safe-area-inset-left)); -webkit-overflow-scrolling:touch; scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto; background:var(--surface); border:1px solid var(--line); color:var(--muted); border-radius:11px; padding:8px 13px; cursor:pointer; font-family:var(--disp); font-weight:600; font-size:14px; letter-spacing:.06em; text-transform:uppercase; transition:.15s; display:flex; flex-direction:column; align-items:center; min-width:58px; line-height:1.1; position:relative}
  .tab small{font-family:var(--body); font-size:9px; letter-spacing:.04em; text-transform:none; color:inherit; opacity:.7; margin-top:2px; font-weight:500}
  .tab[aria-selected="true"]{color:var(--bg); background:var(--amber); border-color:var(--amber)}
  .tab.rest[aria-selected="true"]{background:var(--teal); border-color:var(--teal)}
  .tab.geral[aria-selected="true"]{background:var(--indigo); border-color:var(--indigo)}
  .tab:active{transform:scale(.96)}
  .tab .dot{position:absolute; top:5px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 0 2px var(--surface)}
  .tab[aria-selected="true"] .dot{box-shadow:0 0 0 2px var(--amber)}
  .day{display:none; padding-top:16px}
  .day.active{display:block; animation:fade .25s ease}
  @keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1;transform:none}}
  .day-head{margin-bottom:12px}
  .day-name{font-family:var(--disp); font-weight:700; font-size:30px; line-height:1}
  .focus{display:inline-block; margin-top:7px; font-size:12px; font-weight:600; letter-spacing:.03em; color:var(--indigo); background:rgba(139,149,255,.12); border:1px solid rgba(139,149,255,.28); padding:4px 10px; border-radius:20px}
  .block{margin:18px 0}
  .block-title{font-family:var(--disp); font-weight:600; font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:8px; margin-bottom:9px}
  .block-title::after{content:""; flex:1; height:1px; background:var(--line)}
  .ex{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:12px 13px; margin-bottom:8px; display:flex; gap:11px; align-items:flex-start; transition:.15s}
  .ex.done{border-color:rgba(74,222,128,.35); background:rgba(74,222,128,.06)}
  .ex.done .ex-body{opacity:.72}
  .ex-del{position:absolute; top:9px; right:9px; width:22px; height:22px; border-radius:6px; border:1px solid transparent; background:transparent; color:var(--muted); opacity:.35; font-size:11px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s; padding:0}
  .ex-del:active{opacity:1; color:var(--rose); background:rgba(255,107,107,.12); border-color:rgba(255,107,107,.3); transform:scale(.92)}
  .num{font-family:var(--disp); font-weight:600; font-size:14px; color:var(--amber); background:var(--surface2); border:1px solid var(--line); min-width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; margin-top:1px}
  .ex-check{flex:0 0 auto; width:26px; height:26px; border-radius:7px; border:1px solid var(--line); background:var(--surface2); color:transparent; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; cursor:pointer; margin-top:1px; padding:0; transition:.15s}
  .ex-check:active{transform:scale(.9)}
  .ex-check.done{background:var(--green); border-color:var(--green); color:#08210f}
  .ex-body{flex:1; min-width:0; padding-right:28px}
  .ex-name{font-weight:600; font-size:15px; letter-spacing:-.01em; cursor:text; border-bottom:1px dashed rgba(255,255,255,.16); outline:none; border-radius:2px; transition:.15s}
  .ex-name:focus{border-bottom-color:var(--amber); background:rgba(255,176,32,.08)}
  .ex-name.edited{color:var(--amber)}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
  .chip{font-size:12px; font-weight:600; padding:4px 9px; border-radius:8px; border:1px solid var(--line); background:var(--surface2); color:var(--muted); display:inline-flex; align-items:center; gap:5px; white-space:nowrap}
  .chip .lbl{font-size:9px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); opacity:.8}
  .chip.sr{color:var(--text); cursor:text}
  .chip.sr b{font-family:var(--disp); font-weight:600; font-size:15px}
  .chip.load{color:var(--text); border-color:rgba(255,176,32,.35); cursor:text}
  .chip.load b{color:var(--amber); font-family:var(--disp); font-weight:600; font-size:14px}
  .chip.load.def b{color:var(--muted)}
  .chip.prog{color:var(--teal); border-color:rgba(47,211,184,.3); background:rgba(47,211,184,.07)}
  /* Editable load input */
  .load-input{font-family:var(--disp); font-weight:600; font-size:14px; color:var(--amber); background:transparent; border:none; outline:none; width:auto; min-width:38px; max-width:120px; padding:0; text-align:left; field-sizing:content}
  .load-input::placeholder{color:var(--muted)}
  .chip.load.edited{border-color:var(--amber); background:rgba(255,176,32,.1)}
  .chip .pencil{font-size:10px; opacity:.5}
  .obs{margin-top:8px; font-size:12.5px; color:var(--muted); line-height:1.45}
  .obs::before{content:"\203A  "; color:var(--indigo); font-weight:700}
  /* Tips (dicas) */
  .tips{margin-top:9px; background:var(--surface2); border:1px solid var(--line); border-left:2px solid var(--teal); border-radius:9px; overflow:hidden}
  .tips summary{list-style:none; cursor:pointer; padding:8px 11px; font-family:var(--disp); font-weight:600; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--teal); display:flex; align-items:center; gap:7px}
  .tips summary::-webkit-details-marker{display:none}
  .tips summary::before{content:"🎯"; font-size:12px}
  .tips summary::after{content:"›"; margin-left:auto; font-size:18px; line-height:1; transition:transform .2s; color:var(--muted)}
  .tips[open] summary::after{transform:rotate(90deg)}
  .tips ul{list-style:none; padding:2px 12px 11px 12px; display:grid; gap:7px}
  .tips li{font-size:12.5px; color:var(--muted); line-height:1.45; padding-left:16px; position:relative}
  .tips li::before{content:""; position:absolute; left:2px; top:7px; width:6px; height:6px; border-radius:50%; background:var(--teal); opacity:.7}
  .tips li b{color:var(--text)}
  .cref{margin-top:2px; padding:0 12px 10px; font-size:10.5px; color:var(--muted); opacity:.7; font-style:italic}
  .rest-card{background:linear-gradient(160deg,rgba(47,211,184,.09),rgba(22,26,34,.6)); border:1px solid rgba(47,211,184,.3); border-radius:16px; padding:22px 18px; text-align:center}
  .rest-icon{font-size:34px}
  .rest-card h3{font-family:var(--disp); font-weight:700; font-size:22px; color:var(--teal); margin:8px 0 4px; letter-spacing:.02em}
  .rest-main{font-size:15px; font-weight:600; margin-bottom:14px}
  .rest-list{text-align:left; max-width:440px; margin:0 auto; display:grid; gap:8px}
  .rest-item{background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:11px 13px; font-size:13.5px; color:var(--muted)}
  .rest-item b{color:var(--text)}
  .legend{background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:14px 15px; margin:22px 0 8px}
  .legend h4{font-family:var(--disp); font-weight:600; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); margin-bottom:8px}
  .legend p{font-size:12.5px; color:var(--muted); line-height:1.55}
  .legend p + p{margin-top:6px}
  .legend b{color:var(--text)}
  .star{color:var(--muted)}
  /* Check treinei */
  .check{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:11px 13px; margin-bottom:16px}
  .check-q{font-family:var(--disp); font-weight:600; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
  .check-btns{margin-left:auto; display:flex; gap:6px}
  .check-btn{font-family:var(--disp); font-weight:600; font-size:13px; letter-spacing:.06em; text-transform:uppercase; padding:7px 15px; border-radius:9px; border:1px solid var(--line); background:var(--surface2); color:var(--muted); cursor:pointer; transition:.15s}
  .check-btn:active{transform:scale(.95)}
  .check-btn.yes.on{background:var(--green); border-color:var(--green); color:#08210f}
  .check-btn.no.on{background:var(--rose); border-color:var(--rose); color:#2a0d0d}
  /* ===== GERAL / Dashboard ===== */
  .g-hero{background:linear-gradient(160deg,rgba(139,149,255,.12),rgba(22,26,34,.5)); border:1px solid rgba(139,149,255,.3); border-radius:16px; padding:18px; margin-bottom:14px}
  .g-hero-top{display:flex; align-items:center; gap:16px}
  .ring{--p:0; flex:0 0 auto; width:82px; height:82px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--indigo) calc(var(--p)*1%), var(--surface2) 0)}
  .ring::before{content:""; position:absolute; width:64px; height:64px; border-radius:50%; background:var(--surface)}
  .ring-inner{position:relative; text-align:center; line-height:1}
  .ring-inner b{font-family:var(--disp); font-size:22px; font-weight:700; color:var(--text)}
  .ring-inner small{display:block; font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:2px}
  .g-hero-txt{flex:1; min-width:0}
  .g-hero-txt h3{font-family:var(--disp); font-weight:700; font-size:19px; line-height:1.1}
  .g-hero-txt p{font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.45}
  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 10px; text-align:center}
  .stat b{font-family:var(--disp); font-size:24px; font-weight:700; display:block; line-height:1}
  .stat small{font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); display:block; margin-top:5px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:15px; margin-bottom:14px}
  .card h4{font-family:var(--disp); font-weight:600; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); margin-bottom:12px; display:flex; align-items:center; gap:8px}
  /* intensity gauge */
  .gauge-track{height:10px; border-radius:6px; background:linear-gradient(90deg,var(--teal),var(--green) 33%,var(--amber) 66%,var(--rose)); position:relative; margin:6px 0 8px}
  .gauge-mark{position:absolute; top:-4px; width:4px; height:18px; border-radius:3px; background:var(--text); box-shadow:0 0 0 2px var(--bg); transition:left .4s}
  .gauge-labels{display:flex; justify-content:space-between; font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted)}
  .verdict{margin-top:11px; font-size:13px; line-height:1.5; color:var(--text)}
  .verdict b{color:var(--amber)}
  /* day status list */
  .dlist{display:grid; gap:7px}
  .drow{display:flex; align-items:center; gap:10px; background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:9px 12px; min-width:0}
  .drow .dn{font-family:var(--disp); font-weight:600; font-size:14px; letter-spacing:.04em; min-width:42px}
  .drow .df{font-size:11.5px; color:var(--muted); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .drow .dbtns{display:flex; gap:5px}
  .mini{font-family:var(--disp); font-weight:600; font-size:11px; letter-spacing:.05em; text-transform:uppercase; padding:5px 11px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer}
  .mini.yes.on{background:var(--green); border-color:var(--green); color:#08210f}
  .mini.no.on{background:var(--rose); border-color:var(--rose); color:#2a0d0d}
  /* muscle balance */
  .mrow{margin-bottom:10px}
  .mrow:last-child{margin-bottom:0}
  .mrow-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px}
  .mrow-top .mn{font-size:12.5px; font-weight:600}
  .mrow-top .mv{font-family:var(--disp); font-size:13px; font-weight:600; color:var(--muted)}
  .mrow-top .mv b{color:var(--text)}
  .mbar{height:8px; border-radius:5px; background:var(--surface2); overflow:hidden; position:relative}
  .mbar span{position:absolute; top:0; left:0; height:100%; border-radius:5px; display:block}
  .mtag{font-size:9px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:2px 6px; border-radius:5px; margin-left:6px}
  .mtag.low{background:rgba(255,107,107,.15); color:var(--rose)}
  .mtag.high{background:rgba(255,176,32,.15); color:var(--amber)}
  .mtag.ok{background:rgba(74,222,128,.13); color:var(--green)}
  .m-note{font-size:11px; color:var(--muted); margin-top:11px; line-height:1.45; opacity:.85}
  /* feeling selector */
  .feel{display:flex; gap:6px}
  .feel-btn{flex:1; background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:9px 4px; cursor:pointer; text-align:center; transition:.15s}
  .feel-btn .fe{font-size:20px; display:block}
  .feel-btn .ft{font-size:9px; color:var(--muted); margin-top:3px; letter-spacing:.02em}
  .feel-btn.on{border-color:var(--indigo); background:rgba(139,149,255,.14)}
  .feel-btn:active{transform:scale(.95)}
  /* strategy list */
  .strat{display:grid; gap:9px}
  .strat-item{display:flex; gap:10px; font-size:12.8px; line-height:1.5; color:var(--muted); min-width:0}
  .strat-item .si{flex:0 0 auto; font-size:15px; margin-top:1px}
  .strat-item b{color:var(--text)}
  .acct-input{width:100%; background:var(--surface2); border:1px solid var(--line); border-radius:9px; padding:10px 12px; color:var(--text); font-size:14px; font-family:var(--body); margin-bottom:8px; outline:none; transition:.15s}
  .acct-input:focus{border-color:var(--indigo)}
  .acct-btns{display:flex; gap:8px; margin-top:2px; margin-bottom:8px}
  .acct-btns .mini{flex:1; padding:10px; font-size:12px; text-align:center}
  .acct-status{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .acct-status .dotok{width:8px; height:8px; border-radius:50%; background:var(--green); flex:0 0 auto}
  .btn-reset{width:100%; margin-top:2px; background:var(--surface); border:1px solid rgba(255,107,107,.35); color:var(--rose); font-family:var(--disp); font-weight:600; font-size:13px; letter-spacing:.08em; text-transform:uppercase; padding:13px; border-radius:12px; cursor:pointer; transition:.15s}
  .btn-reset:active{transform:scale(.98)}
  .reset-note{text-align:center; font-size:11px; color:var(--muted); margin-top:8px; opacity:.75}
  footer{text-align:center; padding:26px 14px 8px; color:var(--muted); font-size:11.5px}
  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); background:var(--surface2); border:1px solid var(--line); color:var(--text); padding:11px 18px; border-radius:11px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:.25s; z-index:50; box-shadow:0 8px 24px rgba(0,0,0,.4); display:flex; align-items:center; gap:14px; max-width:88vw}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto}
  .toast-action{background:none; border:none; color:var(--amber); font-family:var(--disp); font-weight:700; letter-spacing:.05em; text-transform:uppercase; font-size:12px; cursor:pointer; padding:0; flex:0 0 auto}
  /* Grupos: busca, filtro por categoria, frequência semanal */
  .cat-filters{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:14px; scrollbar-width:none; -webkit-overflow-scrolling:touch}
  .cat-filters::-webkit-scrollbar{display:none}
  .cat-chip{flex:0 0 auto; font-family:var(--disp); font-weight:600; font-size:11px; letter-spacing:.04em; text-transform:uppercase; padding:7px 13px; border-radius:20px; border:1px solid var(--line); background:var(--surface2); color:var(--muted); cursor:pointer; transition:.15s}
  .cat-chip.on{background:var(--amber); border-color:var(--amber); color:var(--bg)}
  .freq-group{margin-bottom:12px}
  .freq-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; padding:0 2px; gap:8px}
  .freq-name{font-weight:600; font-size:13.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .freq-badge{flex:0 0 auto; font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--indigo); background:rgba(139,149,255,.14); border:1px solid rgba(139,149,255,.3); padding:3px 8px; border-radius:20px}
  .freq-checklist{display:flex; align-items:center; gap:6px; margin-bottom:9px; padding:0 2px; flex-wrap:wrap}
  .freq-pill{width:24px; height:24px; border-radius:7px; border:1px solid var(--line); background:var(--surface2); color:var(--muted); font-family:var(--disp); font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto; padding:0; transition:.15s}
  .freq-pill.done{background:var(--green); border-color:var(--green); color:#08210f}
  .freq-count{font-size:11px; color:var(--muted); margin-left:4px}
  /* Séries×reps editável */
  .sr-input{font-family:var(--disp); font-weight:600; font-size:15px; color:var(--text); background:transparent; border:none; outline:none; width:auto; min-width:34px; max-width:90px; padding:0; text-align:left; field-sizing:content}
  .chip.sr.edited{border-color:rgba(139,149,255,.4); background:rgba(139,149,255,.08)}
  .chip.sr.edited b, .chip.sr.edited .sr-input{color:var(--indigo)}
  .evo-week-grid{display:grid; grid-template-columns:repeat(13, 1fr); gap:3px; margin:10px 0}

<script>
/* ============================================================
   Persistência (localStorage) — cargas + checklist + sensação
   ============================================================ */
// toda escrita local passa por aqui — marca quando mudou (usado pra decidir
// se sincroniza pra cima ou pra baixo) e agenda um envio pra nuvem, se logado.
function markChange(){
  localStorage.setItem('sync:lastChange', Date.now().toString());
  if(typeof scheduleCloudSync==='function') scheduleCloudSync();
}
const LS = {
  load:  k => localStorage.getItem('load:'+k),
  setLoad:(k,v)=>{ localStorage.setItem('load:'+k, v); markChange(); },
  sr:  k => localStorage.getItem('sr:'+k),                // séries×reps, se o usuário editou
  setSr:(k,v)=>{ v? localStorage.setItem('sr:'+k, v) : localStorage.removeItem('sr:'+k); markChange(); },
  name:  k => localStorage.getItem('name:'+k),            // nome do exercício, se o usuário renomeou
  setName:(k,v)=>{ v? localStorage.setItem('name:'+k, v) : localStorage.removeItem('name:'+k); markChange(); },
  removed:  k => localStorage.getItem('removed:'+k)==='1', // exercício removido do treino (reversível)
  setRemoved:(k,v)=>{ v? localStorage.setItem('removed:'+k,'1') : localStorage.removeItem('removed:'+k); markChange(); },
  plan:  ()=> localStorage.getItem('plan') || '4',          // plano ativo: '2' | '3' | '4' dias/semana
  setPlan: v =>{ localStorage.setItem('plan', v); markChange(); },
  trained:  d => localStorage.getItem('trained:'+d),      // 'yes' | 'no' | null
  setTrained:(d,v)=>{ v? localStorage.setItem('trained:'+d, v) : localStorage.removeItem('trained:'+d); markChange(); },
  done:  k => localStorage.getItem('done:'+k)==='1',      // exercício individual feito?
  setDone:(k,v)=>{ v? localStorage.setItem('done:'+k,'1') : localStorage.removeItem('done:'+k); markChange(); },
  feel:  ()=> localStorage.getItem('feel:week'),
  setFeel:v=>{ v? localStorage.setItem('feel:week', v) : localStorage.removeItem('feel:week'); markChange(); },
  evoStart: ()=>{ // início do ciclo anual de periodização (auto-definido na 1ª visita à aba Evolução)
    let v = localStorage.getItem('evo:start');
    if(!v){ v = new Date().toISOString().slice(0,10); localStorage.setItem('evo:start', v); }
    return v;
  },
  setEvoStart:(v)=>{ localStorage.setItem('evo:start', v); markChange(); },
  resetWeek(){ // zera SÓ o checklist (dia + exercícios) e a sensação — mantém cargas, nomes e remoções
    Object.keys(localStorage).forEach(k=>{ if(k.startsWith('trained:')||k.startsWith('done:')||k==='feel:week') localStorage.removeItem(k); });
    markChange();
  }
};

/* ============================================================
   Conta na nuvem (opcional) — Supabase Auth + backup/sincronização
   O app funciona 100% offline sem conta; criar conta só adiciona
   backup automático e sincronia entre aparelhos, por cima do que
   já existe no localStorage.
   ============================================================ */
const SUPABASE_URL = 'https://arkqdpbuxbsufhyxfwyh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFya3FkcGJ1eGJzdWZoeXhmd3loIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MTY5NDQsImV4cCI6MjEwNDE5Mjk0NH0.KKlvhg_VCQ8_u9BUGNImOgh7dVqFzoNj-qvKXB8VygQ';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let cloudUser = null;
let syncTimer = null;

function getSnapshot(){ // tudo que o app gerencia no localStorage, exceto o próprio token de auth
  const snap = {};
  Object.keys(localStorage).forEach(k=>{ if(!k.startsWith('sb-')) snap[k]=localStorage.getItem(k); });
  return snap;
}
function applySnapshot(snap){
  Object.keys(localStorage).forEach(k=>{ if(!k.startsWith('sb-')) localStorage.removeItem(k); });
  Object.entries(snap||{}).forEach(([k,v])=> localStorage.setItem(k, v));
}
async function pushToCloud(){
  if(!sb || !cloudUser) return;
  await sb.from('app_state').upsert({ user_id: cloudUser.id, data: getSnapshot() });
}
async function pullFromCloud(){
  if(!sb || !cloudUser) return;
  const { data, error } = await sb.from('app_state').select('data, updated_at').eq('user_id', cloudUser.id).maybeSingle();
  if(error){ console.warn('Erro ao sincronizar:', error.message); return; }
  if(!data){ await pushToCloud(); return; } // primeiro login: sobe o que já está neste aparelho
  const localTs = parseInt(localStorage.getItem('sync:lastChange')||'0', 10);
  const cloudTs = new Date(data.updated_at).getTime();
  if(cloudTs > localTs){ applySnapshot(data.data); location.reload(); } // outro aparelho tem versão mais nova
  else { await pushToCloud(); } // este aparelho tem a versão mais nova (ou empatado) — sobe
}
function scheduleCloudSync(){
  if(!cloudUser) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushToCloud, 1200);
}
async function initCloudSession(){
  if(!sb) return;
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ cloudUser = session.user; await pullFromCloud(); }
  renderGeral();
}

const toast = (()=>{
  const el=document.getElementById('toast');
  let t;
  return (msg, opts)=>{
    clearTimeout(t);
    if(opts && opts.actionLabel){
      el.innerHTML = `<span>${msg}</span><button class="toast-action" type="button">${opts.actionLabel}</button>`;
      el.querySelector('.toast-action').onclick = ()=>{ opts.onAction(); el.classList.remove('show'); clearTimeout(t); };
    } else {
      el.textContent = msg;
    }
    el.classList.add('show');
    t=setTimeout(()=>el.classList.remove('show'), opts&&opts.actionLabel? 5000 : 1600);
  };
})();

   Dados dos treinos
   mg = grupo muscular primário (p/ relatório) · tips = dicas técnicas
   ============================================================ */
const chip = (cls,lbl,val)=>`<span class="chip ${cls}"><span class="lbl">${lbl}</span>${val}</span>`;

function exRow(e,n,dayBadge){
  const key = e.id; // identidade fixa e permanente do exercício — nunca muda com a posição no array
  const savedSr = LS.sr(key);
  const srVal = savedSr!==null ? savedSr : e.sr;
  const srEdited = savedSr!==null && savedSr!==e.sr;
  let chips = `<span class="chip sr${srEdited?' edited':''}" data-srkey="${key}">
      <span class="lbl">Séries×Reps</span>
      <input class="sr-input" value="${srVal.replace(/"/g,'&quot;')}" data-default="${e.sr.replace(/"/g,'&quot;')}" aria-label="Editar séries e reps de ${e.ex.replace(/"/g,'&quot;')}" spellcheck="false">
      <span class="pencil">✎</span></span>`;
  if(e.carga!==undefined){
    const saved = LS.load(key);
    const val = saved!==null ? saved : e.carga;
    const edited = saved!==null && saved!==e.carga;
    chips += `<span class="chip load${e.def?' def':''}${edited?' edited':''}" data-key="${key}">
        <span class="lbl">Carga</span>
        <input class="load-input" value="${val.replace(/"/g,'&quot;')}" data-default="${e.carga.replace(/"/g,'&quot;')}" aria-label="Editar carga de ${e.ex}" spellcheck="false">
        <span class="pencil">✎</span></span>`;
  }
  if(e.prog){ chips += chip('prog','Progressão', e.prog); }
  const num = n? `<div class="num">${n}</div>` : dayBadge? `<div class="num" style="font-size:9.5px">${dayBadge}</div>` : '';
  let tips='';
  if(e.tips){
    tips = `<details class="tips"><summary>Como fazer certo</summary><ul>${e.tips.map(t=>`<li>${t}</li>`).join('')}</ul>${e.cref?`<div class="cref">${e.cref}</div>`:''}</details>`;
  }
  const isDone = LS.done(key);
  const check = `<button class="ex-check${isDone?' done':''}" data-exdone="${key}" type="button" aria-label="Marcar ${e.ex.replace(/"/g,'&quot;')} como feito">✓</button>`;
  const del = `<button class="ex-del" data-exdel="${key}" type="button" aria-label="Remover ${e.ex.replace(/"/g,'&quot;')} do treino">✕</button>`;
  const savedName = LS.name(key);
  const displayName = savedName!==null ? savedName : e.ex;
  const nameEdited = savedName!==null && savedName!==e.ex;
  const nameEl = `<div class="ex-name${nameEdited?' edited':''}" contenteditable="true" spellcheck="false" data-namekey="${key}" data-default="${e.ex.replace(/"/g,'&quot;')}" aria-label="Editar nome do exercício">${displayName}</div>`;
  return `<div class="ex${isDone?' done':''}" data-exwrap="${key}">${check}${num}<div class="ex-body">${nameEl}<div class="chips">${chips}</div>${e.obs?`<div class="obs">${e.obs}</div>`:''}${tips}</div>${del}</div>`;
}

const ACTIVE_PLAN = (PLANS[LS.plan()]? LS.plan() : '4');
const days = PLANS[ACTIVE_PLAN].days;
// exercícios visíveis de um bloco (exclui os removidos pelo usuário — reversível)
const activeItems = bl => bl.items.filter(it=>!LS.removed(it.id));

/* ============================================================
   Cálculos p/ o relatório (séries semanais por grupo muscular)
   ============================================================ */
const setsOf = sr => { const m=String(sr).match(/^\s*(\d+)/); return m?parseInt(m[1]):0; };
const effectiveSr = it => LS.sr(it.id) || it.sr; // usa o sr editado pelo usuário, se houver
const trainingDays = days.filter(d=>d.type==='treino');

// exercícios adicionados manualmente pelo usuário (aba Grupos), por dia do plano ativo
function getCustomItems(dayId){
  try{ return JSON.parse(localStorage.getItem('custom:'+ACTIVE_PLAN+':'+dayId)||'[]'); } catch(e){ return []; }
}
function saveCustomItems(dayId, list){ localStorage.setItem('custom:'+ACTIVE_PLAN+':'+dayId, JSON.stringify(list)); markChange(); }
// blocos de um dia incluindo, se houver, os exercícios personalizados como um bloco extra
function blocksWithCustom(d){
  const custom = getCustomItems(d.id);
  return custom.length ? [...d.blocks, {t:'Meus exercícios', num:true, items:custom}] : d.blocks;
}

function daySets(d){ // séries efetivas do bloco principal "Treino" (exclui exercícios removidos)
  let n=0; blocksWithCustom(d).forEach(bl=>{ if(bl.num) activeItems(bl).forEach(it=> n+=setsOf(effectiveSr(it))); }); return n;
}
function plannedTotalSets(){ return trainingDays.reduce((s,d)=>s+daySets(d),0); }

// séries semanais planejadas por grupo muscular — qualquer item com mg conta,
// não só o bloco "Treino" (assim o abdômen dos blocos pré/pós-treino também entra),
// e exercícios removidos pelo usuário não contam.
function muscleVolume(){
  const mv={};
  trainingDays.forEach(d=> blocksWithCustom(d).forEach(bl=> activeItems(bl).forEach(it=>{
    if(it.mg){ mv[it.mg]=(mv[it.mg]||0)+setsOf(effectiveSr(it)); }
  })));
  return mv;
}
// zonas de referência (séries/semana por grupo p/ hipertrofia)
const MG_REF={min:10,max:20};
const MG_COLOR={Peito:'#FF8FA3',Costas:'#8B95FF',Ombro:'#FFB020',Bíceps:'#2FD3B8',Tríceps:'#4ADE80',Pernas:'#7EE0FF',Abdômen:'#E879F9'};

// todo item VISÍVEL (não removido) de todo bloco de um dia, com sua id fixa
function dayExerciseItems(d){
  const out=[];
  blocksWithCustom(d).forEach(bl=> activeItems(bl).forEach(it=> out.push({key:it.id, sr:effectiveSr(it), mg:it.mg, main:!!bl.num})));
  return out;
}
// exercícios removidos (todos os dias do plano ativo) — pra listar e permitir restaurar
function removedExercises(){
  const out=[];
  trainingDays.forEach(d=> blocksWithCustom(d).forEach(bl=> bl.items.forEach(it=>{
    if(LS.removed(it.id)) out.push({id:it.id, name:LS.name(it.id)||it.ex, day:d.tab});
  })));
  return out;
}
// estatísticas do que foi REALMENTE marcado como feito (exercício a exercício)
function doneStats(){
  let doneCount=0, totalCount=0, doneSets=0;
  const doneMv={}, perDay={};
  trainingDays.forEach(d=>{
    const items = dayExerciseItems(d);
    let dDone=0;
    items.forEach(it=>{
      totalCount++;
      if(LS.done(it.key)){
        doneCount++; dDone++;
        if(it.main) doneSets += setsOf(it.sr);
        if(it.mg) doneMv[it.mg]=(doneMv[it.mg]||0)+setsOf(it.sr);
      }
    });
    perDay[d.id] = { done:dDone, total:items.length };
  });
  return { doneCount, totalCount, doneSets, doneMv, perDay };
}

/* ============================================================
   EVOLUÇÃO ANUAL — periodização em blocos (mesociclos de 4 semanas:
   3 de progressão de volume + 1 de deload), com o volume atual do
   plano ativo (muscleVolume()) como baseline. A meta de séries/semana
   sobe a cada mesociclo (até um platô realista) e cai no deload.
   ============================================================ */
const EVO_MESO_LEN = 4;      // semanas por mesociclo
const EVO_YEAR_WEEKS = 52;
const EVO_WEEK_MULT = [1, 1.08, 1.16, 0.6]; // semana 1,2,3 (progressão) e 4 (deload) dentro do mesociclo
function evoBlockMultiplier(block){ return 1 + 0.03*Math.min(block, 8); } // ramp nos 1ºs 9 blocos, depois platô
function evoWeekIndexFromStart(){
  const start = new Date(LS.evoStart()+'T00:00:00');
  const now = new Date();
  const daysSince = Math.floor((now - start) / 86400000);
  return Math.max(0, Math.floor(daysSince/7));
}
function evoPhaseLabel(weekInBlock){
  return ['Semana 1 · Acúmulo','Semana 2 · Acúmulo','Semana 3 · Intensificação','Semana 4 · Deload'][weekInBlock];
}
function evoWeekMeta(weekIndex){
  const cycleWeek = weekIndex % EVO_YEAR_WEEKS;
  const block = Math.floor(cycleWeek / EVO_MESO_LEN);
  const weekInBlock = cycleWeek % EVO_MESO_LEN;
  const yearNum = Math.floor(weekIndex / EVO_YEAR_WEEKS) + 1;
  return { cycleWeek, block, weekInBlock, yearNum, mult: evoBlockMultiplier(block)*EVO_WEEK_MULT[weekInBlock], isDeload: weekInBlock===3 };
}
function evoTargets(weekIndex){
  const base = muscleVolume();
  const meta = evoWeekMeta(weekIndex);
  const targets = {};
  Object.keys(base).forEach(mg=>{ targets[mg] = Math.max(1, Math.round(base[mg]*meta.mult)); });
  return { targets, meta, base };
}

function renderEvolucao(){
  const weekIndex = evoWeekIndexFromStart();
  const { targets, meta, base } = evoTargets(weekIndex);
  const maxTarget = Math.max(1, ...Object.values(targets));
  const rows = MG_ORDER.filter(g=>base[g]).map(g=>{
    const t=targets[g], b=base[g], delta=t-b;
    const deltaTxt = delta===0?'baseline' : (delta>0?`+${delta}`:`${delta}`);
    const deltaColor = delta>0?'var(--amber)' : delta<0?'var(--indigo)':'var(--muted)';
    const w=Math.round(t/maxTarget*100);
    return `<div class="mrow"><div class="mrow-top"><span class="mn">${g}</span><span class="mv"><b>${t}</b> séries/sem <span style="color:${deltaColor};font-size:10px;margin-left:4px">(${deltaTxt})</span></span></div><div class="mbar"><span style="width:100%;background:var(--surface2)"></span><span style="width:${w}%;background:${MG_COLOR[g]}"></span></div></div>`;
  }).join('');

  const cells=[];
  for(let w=0; w<EVO_YEAR_WEEKS; w++){
    const m = evoWeekMeta(w);
    let cls = m.isDeload ? 'deload' : ['acc1','acc2','acc3'][m.weekInBlock];
    if(w===meta.cycleWeek) cls+=' now'; else if(w<meta.cycleWeek) cls+=' past';
    cells.push(`<div class="evo-cell ${cls}" title="Semana ${w+1} do ciclo"></div>`);
  }

  const nextPhaseTxt = meta.isDeload
    ? 'Você está na semana de deload — reduza volume/intensidade (a meta acima já reflete isso) e priorize técnica, sono e recuperação.'
    : `Faltam ${3-meta.weekInBlock} semana(s) até o próximo deload.`;

  evoSec.innerHTML = `
    <div class="day-head"><div class="day-name">Evolução Anual</div><span class="focus">Periodização · ${PLANS[ACTIVE_PLAN].title}</span></div>

    <div class="card">
      <h4>📅 Onde você está no ciclo</h4>
      <div class="stat-row">
        <div class="stat"><b style="color:var(--amber)">${meta.cycleWeek+1}</b><small>Semana do ciclo</small></div>
        <div class="stat"><b style="color:var(--indigo)">${meta.block+1}/13</b><small>Mesociclo</small></div>
        <div class="stat"><b style="color:${meta.isDeload?'var(--teal)':'var(--green)'}">${meta.isDeload?'Deload':'Progressão'}</b><small>Fase atual</small></div>
      </div>
      <div class="verdict"><b>${evoPhaseLabel(meta.weekInBlock)}.</b> ${nextPhaseTxt}</div>
    </div>

    <div class="card">
      <h4>🎯 Meta de séries desta semana <span style="font-size:9px;color:var(--muted);letter-spacing:.04em">(vs. seu plano atual)</span></h4>
      ${rows || '<div class="m-note">Nenhum volume por grupo detectado no plano ativo.</div>'}
      <div class="m-note">Baseline = seu plano atual (${PLANS[ACTIVE_PLAN].title}). A meta sobe aos poucos a cada mesociclo e cai no deload — ajuste séries/carga de cada exercício (na aba do dia ou em Grupos) pra ir batendo esses números ao longo do ano.</div>
    </div>

    <div class="card">
      <h4>🗓 Panorama do ano <span style="font-size:9px;color:var(--muted);letter-spacing:.04em">(52 semanas · ano ${meta.yearNum})</span></h4>
      <div class="evo-week-grid">${cells.join('')}</div>
      <div class="evo-legend"><span><i class="evo-dot acc1"></i>Início do bloco</span><span><i class="evo-dot acc3"></i>Pico de volume</span><span><i class="evo-dot deload"></i>Deload</span></div>
      <div class="m-note">Cada mesociclo tem 4 semanas: 3 de progressão de volume + 1 de deload pra dissipar fadiga antes do próximo bloco.</div>
    </div>

    <div class="card">
      <h4>📖 Base científica</h4>
      <div class="cref" style="padding:0">Periodização em blocos (acúmulo → intensificação → deload) é a estrutura mais usada em treino de força/hipertrofia pra sustentar progressão de volume ao longo do ano sem estagnar nem acumular fadiga demais. A dupla progressão (reps → carga) de cada exercício continua sendo o motor da progressão dentro da semana — este plano anual só ajusta o volume-alvo (séries/semana) que indica quando vale adicionar mais séries, um exercício extra ou mais frequência.</div>
    </div>

    <div class="card">
      <h4>⚙️ Ciclo</h4>
      <div class="m-note">Início do ciclo: <b style="color:var(--text)">${new Date(LS.evoStart()+'T00:00:00').toLocaleDateString('pt-BR')}</b></div>
      <button class="mini no" id="evoRestart" style="margin-top:8px">Reiniciar ciclo a partir de hoje</button>
    </div>
  `;
}

function renderGeral(){
  const doneDays = trainingDays.filter(d=>LS.trained(d.id)==='yes');
  const done = doneDays.length, total = trainingDays.length;
  const pct = Math.round(done/total*100);
  const ds = doneStats();
  const doneSets = ds.doneSets;
  const totalSets = plannedTotalSets();
  const feel = LS.feel();
  const fd = feelData();

  // veredito de intensidade (0..100 na barra) combinando volume feito + sensação
  let load = totalSets? doneSets/totalSets : 0; // 0..1
  let pos = Math.min(100, Math.round(load*85 + (feel? (parseInt(feel)-1)/4*15 : 0)));
  let verdict, vword;
  if(done===0){ verdict='Marque seus treinos e sua sensação da semana para gerar a leitura de intensidade.'; vword='Sem dados'; pos=2; }
  else if(load<0.5){ vword='Leve/Moderado'; verdict='Volume abaixo do planejado — há margem para treinar mais, se a recuperação estiver boa.'; }
  else if(load<0.8){ vword='Ideal'; verdict='Você está na faixa ideal de volume para hipertrofia. Mantenha o ritmo e o sono em dia.'; }
  else if(load<1){ vword='Alto'; verdict='Volume alto. Priorize sono (7–9h), proteína e os dias de descanso ativo para recuperar.'; }
  else { vword='Muito alto'; verdict='Programa completo — carga sistêmica elevada. Observe sinais de excesso: sono ruim, cargas caindo, ânimo baixo.'; }
  if(feel==='5'||feel==='4'){ verdict+=' Sua sensação indica fadiga acumulada — considere uma sessão mais leve ou um dia extra de descanso.'; }

  // volume por grupo muscular — planejado vs. o que foi de fato marcado como feito
  const mv=muscleVolume();
  const order=['Ombro','Tríceps','Pernas','Bíceps','Costas','Peito','Abdômen'];
  const maxV=Math.max(...Object.values(mv));
  const mbars=order.map(g=>{
    const v=mv[g]||0; const w=Math.round(v/maxV*100);
    const dv=ds.doneMv[g]||0; const dw=v? Math.round(Math.min(dv,v)/maxV*100) : 0;
    let tag='ok', tw='Ideal';
    if(v>MG_REF.max){ tag='high'; tw='Alto'; } else if(v<MG_REF.min){ tag='low'; tw='Baixo'; }
    return `<div class="mrow"><div class="mrow-top"><span class="mn">${g}<span class="mtag ${tag}">${tw}</span></span><span class="mv"><b>${dv}</b>/${v} séries/sem</span></div><div class="mbar"><span style="width:${w}%;background:${MG_COLOR[g]};opacity:.28"></span><span style="width:${dw}%;background:${MG_COLOR[g]}"></span></div></div>`;
  }).join('');
  // nota dinâmica: aponta o grupo de maior e menor volume real do plano ativo
  const rankedG = order.filter(g=>mv[g]).sort((a,b)=>(mv[b]||0)-(mv[a]||0));
  const balanceNote = rankedG.length>=2
    ? `<b>${rankedG[0]}</b> concentra o maior volume da semana e <b>${rankedG[rankedG.length-1]}</b> o menor — normal em programas com foco definido; use os dias de descanso e o sono para sustentar esse volume.`
    : 'Marque exercícios como feitos pra ver o comparativo planejado vs. realizado.';
  const removed = removedExercises();

  // status por dia (treinei sim/não + progresso de exercícios marcados)
  const dlist=trainingDays.map(d=>{
    const st=LS.trained(d.id);
    const dd=ds.perDay[d.id];
    return `<div class="drow"><span class="dn">${d.tab}</span><span class="df">${d.focus} · <b style="color:var(--text)">${dd.done}/${dd.total}</b> exercícios</span><div class="dbtns">
      <button class="mini yes${st==='yes'?' on':''}" data-tr="${d.id}" data-v="yes">Sim</button>
      <button class="mini no${st==='no'?' on':''}" data-tr="${d.id}" data-v="no">Não</button></div></div>`;
  }).join('');

  // progresso de exercícios marcados como feitos, por dia (barra + contagem)
  const exDoneRows=trainingDays.map(d=>{
    const dd=ds.perDay[d.id]; const w=dd.total? Math.round(dd.done/dd.total*100):0;
    return `<div class="mrow"><div class="mrow-top"><span class="mn">${d.name}</span><span class="mv"><b>${dd.done}</b>/${dd.total}</span></div><div class="mbar"><span style="width:100%;background:var(--surface2)"></span><span style="width:${w}%;background:var(--green)"></span></div></div>`;
  }).join('');

  // feeling selector
  const feelBtns=[1,2,3,4,5].map(n=>`<button class="feel-btn${feel==String(n)?' on':''}" data-feel="${n}"><span class="fe">${fd[n].e}</span><span class="ft">${fd[n].t}</span></button>`).join('');
  const advice = feel ? feelAdvice()[parseInt(feel)] : null;

  geralSec.innerHTML=`
    <div class="day-head"><div class="day-name">Geral</div><span class="focus">Relatório semanal · painel</span></div>

    <div class="g-hero">
      <div class="g-hero-top">
        <div class="ring" style="--p:${pct}; position:relative; display:grid; place-items:center">
          <div class="ring-inner"><b>${done}/${total}</b><small>Treinos</small></div>
        </div>
        <div class="g-hero-txt">
          <h3>${done===total?'Semana completa! 🔥':done===0?'Bora começar a semana':'Semana em andamento'}</h3>
          <p>${done} de ${total} treinos marcados como feitos${feel?` · sensação: <b style="color:var(--text)">${fd[feel].e} ${fd[feel].t}</b>`:''}.</p>
        </div>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat"><b style="color:var(--green)">${done}</b><small>Feitos</small></div>
      <div class="stat"><b style="color:var(--amber)">${doneSets}</b><small>Séries feitas</small></div>
      <div class="stat"><b style="color:var(--indigo)">${totalSets}</b><small>Planejadas</small></div>
    </div>

    <div class="card">
      <h4>⚡ Intensidade da semana</h4>
      <div class="gauge-track"><div class="gauge-mark" style="left:calc(${pos}% - 2px)"></div></div>
      <div class="gauge-labels"><span>Leve</span><span>Ideal</span><span>Alto</span><span>Excessivo</span></div>
      <div class="verdict"><b>${vword}.</b> ${verdict}</div>
    </div>

    <div class="card">
      <h4>😮‍💨 Como você se sente esta semana?</h4>
      <div class="feel">${feelBtns}</div>
      <div class="m-note">Autorregulação: seu corpo é o melhor sensor. Marque a sensação e o painel ajusta a leitura de intensidade.</div>
    </div>

    <div class="card">
      <h4>✅ Checklist da semana</h4>
      <div class="dlist">${dlist}</div>
    </div>

    <div class="card">
      <h4>☑️ Exercícios feitos <span style="font-size:9px;color:var(--muted);letter-spacing:.04em">(${ds.doneCount}/${ds.totalCount} marcados)</span></h4>
      ${exDoneRows}
      <div class="m-note">Toque no ✓ de cada exercício, em qualquer dia, pra marcar que fez. Some tudo aqui e no equilíbrio muscular abaixo.</div>
    </div>

    <div class="card">
      <h4>⚖️ Equilíbrio muscular <span style="font-size:9px;color:var(--muted);letter-spacing:.04em">(alvo 10–20 séries/sem)</span></h4>
      ${mbars}
      <div class="m-note">Barra clara = planejado · barra cheia = <b style="color:var(--text)">o que você já marcou como feito</b>. ${balanceNote}</div>
    </div>

    <div class="card">
      <h4>🧠 Estratégias & melhorias</h4>
      <div class="strat">
        ${PLANS[ACTIVE_PLAN].strategies.map(s=>`<div class="strat-item"><span class="si">${s.si}</span><div>${s.html}</div></div>`).join('')}
      </div>
    </div>

    ${removed.length? `
    <div class="card">
      <h4>🗑 Exercícios removidos <span style="font-size:9px;color:var(--muted);letter-spacing:.04em">(${removed.length})</span></h4>
      <div class="dlist">${removed.map(r=>`<div class="drow"><span class="dn">${r.day}</span><span class="df">${r.name}</span><div class="dbtns"><button class="mini yes" data-exrestore="${r.id}">Restaurar</button></div></div>`).join('')}</div>
      <div class="m-note">Remover um exercício tira ele da lista e das contas do relatório, sem apagar nenhuma carga salva. Restaurar recarrega o app.</div>
    </div>` : ''}

    <div class="card">
      <h4>🎯 O que fazer no treino de hoje</h4>
      ${advice
        ? `<div class="verdict" style="margin-top:0"><b style="color:${advice.color}">${advice.tag}.</b> ${advice.text}</div><div class="cref" style="padding:0; margin-top:9px"><b>Base científica:</b> ${advice.cref}</div>`
        : `<div class="m-note">Marque acima como você está se sentindo esta semana pra receber uma recomendação prática, com base científica, sobre o treino de hoje.</div>`}
    </div>

    <div class="card">${accountCardHTML()}</div>

    <button class="btn-reset" id="resetBtn">🗑 Zerar semana (só o checklist)</button>
    <div class="reset-note">Zera "treinei ou não", os exercícios marcados e a sensação da semana. <b>As cargas que você editou são mantidas.</b></div>
  `;
}

// card de conta — opcional. Sem login o app funciona 100% offline, salvo só neste
// aparelho; criar conta liga o backup automático e a sincronização entre aparelhos.
function accountCardHTML(){
  if(cloudUser){
    return `<h4>👤 Conta</h4>
      <div class="acct-status"><span class="dotok"></span><span>Logado como <b style="color:var(--text)">${cloudUser.email}</b> · sincronizado na nuvem</span></div>
      <button class="mini no" id="acctLogout" style="margin-top:10px">Sair da conta</button>`;
  }
  return `<h4>👤 Conta — backup na nuvem (opcional)</h4>
    <input type="email" id="acctEmail" class="acct-input" placeholder="seu@email.com" autocomplete="email">
    <input type="password" id="acctPassword" class="acct-input" placeholder="Senha (mín. 6 caracteres)" autocomplete="current-password">
    <div class="acct-btns">
      <button class="mini yes" id="acctSignup">Criar conta</button>
      <button class="mini" id="acctLogin">Entrar</button>
    </div>
    <div class="m-note" id="acctMsg"></div>
    <div class="m-note">Sem conta o app já funciona 100% offline, salvo só neste aparelho. Criar conta faz backup automático e sincroniza com outros celulares — nada muda no que já está salvo aqui.</div>`;
}

/* ============================================================
   Interações
   ============================================================ */
function updateDots(){
  trainingDays.forEach(d=>{
    const dot=document.querySelector(`[data-dot="${d.id}"]`);
    if(dot) dot.style.display = LS.trained(d.id)==='yes'?'block':'none';
  });
}
function syncCheckBtns(id){
  const st=LS.trained(id);
  document.querySelectorAll(`.check-btn[data-tr="${id}"]`).forEach(b=> b.classList.toggle('on', b.dataset.v===st));
}

// delegação de eventos
// um mesmo exercício pode estar renderizado em 2 lugares ao mesmo tempo (aba do dia
// + aba Grupos) — por isso usamos querySelectorAll aqui, nunca querySelector, pra
// manter as duas cópias em sincronia.
function syncExCheck(key){
  const on=LS.done(key);
  document.querySelectorAll(`[data-exdone="${key}"]`).forEach(btn=> btn.classList.toggle('done', on));
  document.querySelectorAll(`[data-exwrap="${key}"]`).forEach(wrap=> wrap.classList.toggle('done', on));
}
function syncAllExChecks(){
  document.querySelectorAll('.ex-check').forEach(btn=> syncExCheck(btn.dataset.exdone));
}

contentEl.addEventListener('click', e=>{
  const exd=e.target.closest('[data-exdone]');
  if(exd){
    const key=exd.dataset.exdone;
    const on=!LS.done(key);
    LS.setDone(key, on);
    syncExCheck(key);
    renderGeral();
    return;
  }
  const del=e.target.closest('[data-exdel]');
  if(del){
    const key=del.dataset.exdel;
    const name=del.closest('.ex').querySelector('.ex-name').textContent.trim();
    if(confirm(`Remover "${name}" do treino? Nenhuma carga é apagada — dá pra desfazer.`)){
      LS.setRemoved(key, true);
      document.querySelectorAll(`[data-exwrap="${key}"]`).forEach(row=> row.remove());
      renderGeral();
      toast('Exercício removido', { actionLabel:'DESFAZER', onAction:()=>{
        LS.setRemoved(key, false);
        const activeId = document.querySelector('.tab[aria-selected="true"]')?.dataset.id;
        if(activeId) select(activeId);
        toast('Exercício restaurado ✅');
      }});
    }
    return;
  }
  const res=e.target.closest('[data-exrestore]');
  if(res){
    LS.setRemoved(res.dataset.exrestore, false);
    renderGeral();
    toast('Exercício restaurado ✅');
    return;
  }
  const tr=e.target.closest('[data-tr]');
  if(tr){
    const id=tr.dataset.tr, v=tr.dataset.v;
    const cur=LS.trained(id);
    LS.setTrained(id, cur===v? null : v); // toque de novo desmarca
    syncCheckBtns(id); updateDots(); renderGeral();
    if(cur!==v) toast(v==='yes'?'Treino marcado ✅':'Marcado como não feito');
    return;
  }
  const fb=e.target.closest('[data-feel]');
  if(fb){ const v=fb.dataset.feel; LS.setFeel(LS.feel()===v?null:v); renderGeral(); return; }
  if(e.target.id==='resetBtn'){
    if(confirm('Zerar o checklist (dia e exercícios) e a sensação da semana? As cargas editadas serão mantidas.')){
      LS.resetWeek();
      trainingDays.forEach(d=>syncCheckBtns(d.id)); updateDots(); syncAllExChecks(); renderGeral();
      toast('Semana zerada — cargas preservadas');
    }
    return;
  }
  if(e.target.id==='acctSignup' || e.target.id==='acctLogin'){
    acctAuth(e.target.id==='acctSignup' ? 'signup' : 'login');
    return;
  }
  if(e.target.id==='acctLogout'){
    if(!sb) return;
    sb.auth.signOut().then(()=>{ cloudUser=null; renderGeral(); toast('Você saiu da conta — dados continuam salvos neste aparelho'); });
    return;
  }
  const catChip=e.target.closest('.cat-chip');
  if(catChip){
    gruposState.category = catChip.dataset.cat;
    document.querySelectorAll('.cat-chip').forEach(c=>c.classList.toggle('on', c===catChip));
    renderGruposResults();
    return;
  }
  if(e.target.id==='addExBtn'){ gruposState.showAddForm=true; renderGrupos(); return; }
  if(e.target.id==='cancelNewEx'){ gruposState.showAddForm=false; renderGrupos(); return; }
  if(e.target.id==='saveNewEx'){ addCustomExercise(); return; }
  if(e.target.id==='evoRestart'){
    if(confirm('Reiniciar o ciclo de periodização a partir de hoje? Você volta pra semana 1 do mesociclo 1.')){
      LS.setEvoStart(new Date().toISOString().slice(0,10));
      renderEvolucao();
      toast('Ciclo reiniciado 🔄');
    }
    return;
  }
});

// entrada de busca da aba Grupos — só troca o container de resultados, preserva o foco do campo
contentEl.addEventListener('input', e=>{
  if(e.target.id==='gruposSearch'){
    gruposState.search = e.target.value;
    renderGruposResults();
  }
});

// cria um exercício personalizado (aba Grupos) e injeta no dia escolhido
function addCustomExercise(){
  const nameInp = document.getElementById('newExName');
  const mgSel = document.getElementById('newExMg');
  const daySel = document.getElementById('newExDay');
  const srInp = document.getElementById('newExSr');
  const cargaInp = document.getElementById('newExCarga');
  const name = nameInp.value.trim();
  const sr = srInp.value.trim();
  if(!name){ toast('Digite o nome do exercício'); nameInp.focus(); return; }
  if(!sr){ toast('Digite séries×reps (ex: 3×12)'); srInp.focus(); return; }
  const dayId = daySel.value;
  const item = { ex:name, id:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,7), sr };
  if(mgSel.value) item.mg = mgSel.value;
  const carga = cargaInp.value.trim();
  if(carga) item.carga = carga;
  const list = getCustomItems(dayId);
  list.push(item);
  saveCustomItems(dayId, list);
  gruposState.showAddForm = false;
  renderGrupos();
  renderGeral();
  toast('Exercício adicionado ✅');
}

// cria conta ou faz login por email/senha, com feedback na própria tela
async function acctAuth(kind){
  const msgEl = document.getElementById('acctMsg');
  if(!sb){ msgEl.textContent='Não foi possível conectar ao servidor de contas agora. Verifique sua internet e tente de novo — seus dados continuam salvos neste aparelho normalmente.'; msgEl.style.color='var(--rose)'; return; }
  const email = document.getElementById('acctEmail').value.trim();
  const password = document.getElementById('acctPassword').value;
  if(!email || !password){ msgEl.textContent='Preencha email e senha.'; msgEl.style.color='var(--rose)'; return; }
  if(password.length<6){ msgEl.textContent='A senha precisa ter pelo menos 6 caracteres.'; msgEl.style.color='var(--rose)'; return; }
  msgEl.style.color='var(--muted)';
  msgEl.textContent = kind==='signup' ? 'Criando conta…' : 'Entrando…';
  let result;
  try{
    result = kind==='signup'
      ? await sb.auth.signUp({ email, password })
      : await sb.auth.signInWithPassword({ email, password });
  } catch(err){
    msgEl.textContent='Falha de conexão com o servidor de contas. Tente de novo em instantes.'; msgEl.style.color='var(--rose)'; return;
  }
  const { data, error } = result;
  if(error){ msgEl.textContent = error.message; msgEl.style.color='var(--rose)'; return; }
  if(kind==='signup' && !data.session){
    msgEl.style.color='var(--teal)';
    msgEl.textContent = 'Conta criada! Confira seu email pra confirmar e depois toque em "Entrar".';
    return;
  }
  cloudUser = data.user;
  toast('Login feito — sincronizando…');
  await pullFromCloud();
  renderGeral();
}

// edição de cargas
contentEl.addEventListener('change', e=>{
  if(e.target.classList.contains('load-input')){
    const inp=e.target, chip=inp.closest('.chip.load'), key=chip.dataset.key;
    const val=inp.value.trim(), def=inp.dataset.default;
    if(val===''){ inp.value=def; LS.setLoad(key,def); }
    else LS.setLoad(key, val);
    chip.classList.toggle('edited', inp.value.trim()!==def && inp.value.trim()!=='');
    chip.classList.toggle('def', false);
    toast('Carga salva 💾');
    return;
  }
  if(e.target.classList.contains('sr-input')){
    const inp=e.target, chip=inp.closest('.chip.sr'), key=chip.dataset.srkey;
    const val=inp.value.trim(), def=inp.dataset.default;
    if(val===''){ inp.value=def; LS.setSr(key,null); chip.classList.remove('edited'); }
    else { LS.setSr(key, val); chip.classList.toggle('edited', val!==def); }
    toast('Séries×reps salvo 💾');
  }
});
// edição do nome do exercício (contenteditable, salva ao sair do campo)
contentEl.addEventListener('focusout', e=>{
  if(e.target.classList.contains('ex-name')){
    const el=e.target, key=el.dataset.namekey, def=el.dataset.default;
    let val=el.textContent.replace(/\s+/g,' ').trim();
    if(val===''){ val=def; }
    el.textContent=val;
    if(val===def){ LS.setName(key,null); el.classList.remove('edited'); }
    else { LS.setName(key,val); el.classList.add('edited'); toast('Nome salvo ✏️'); }
  }
});
contentEl.addEventListener('focusin', e=>{
  if(e.target.classList.contains('load-input') || e.target.classList.contains('sr-input')){ e.target.select(); return; }
  if(e.target.classList.contains('ex-name')){
    const range=document.createRange(); range.selectNodeContents(e.target);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  }
});
// Enter confirma
contentEl.addEventListener('keydown', e=>{
  if((e.target.classList.contains('load-input') || e.target.classList.contains('sr-input')) && e.key==='Enter'){ e.preventDefault(); e.target.blur(); }
  if(e.target.classList.contains('ex-name') && e.key==='Enter'){ e.preventDefault(); e.target.blur(); }
});

function select(id){
  document.querySelectorAll('.tab').forEach(t=> t.setAttribute('aria-selected', t.dataset.id===id?'true':'false'));
  document.querySelectorAll('.day').forEach(s=> s.classList.toggle('active', s.id==='day-'+id));
  if(id==='geral') renderGeral();
  else if(id==='grupos') renderGrupos();
  else if(id==='evolucao') renderEvolucao();
  else {
    // dias de treino/descanso são sempre remontados na hora, a partir do LS —
    // garante que nunca fiquem desatualizados em relação à aba Grupos.
    const d = days.find(x=>x.id===id);
    if(d){
      document.getElementById('day-'+id).innerHTML = renderDayHTML(d);
      if(d.type==='treino') syncCheckBtns(d.id);
    }
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

// init
updateDots();
renderGeral();
initCloudSession(); // se já havia login salvo, sincroniza em segundo plano
</script>
<script>
/* Registro do Service Worker — habilita instalação e uso offline.
   Auto-atualiza: quando um SW novo assume o controle, recarrega 1x
   para o app instalado sempre exibir a versão mais recente. */
if('serviceWorker' in navigator){
  // Só recarrega numa atualização real (já havia um SW no controle),
  // nunca no primeiro acesso (quando o clients.claim inicial assume).
  const hadController = !!navigator.serviceWorker.controller;
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(refreshing || !hadController) return; refreshing=true; window.location.reload();
  });
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js', {scope:'./'}).then(reg=>{
      // O SW já faz self.skipWaiting()+clients.claim(); só forçamos a checagem.
      reg.update && reg.update();
    }).catch(err=>console.warn('SW falhou:', err));
  });
}
</script>
